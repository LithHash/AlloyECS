name = "lithhash/alloyecs"
version = "0.1.30"
description = "A fast, feature-rich Entity Component System for Roblox."
authors = ["LithHash"]
repository = "https://github.com/LithHash/AlloyECS"
license = "MIT"
includes = ["src/*", "README.md", "pesde.toml"]

[target]
